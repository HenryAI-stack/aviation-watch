name: Android CI

# Public repository: GitHub-hosted runners are free with no minute limit.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Bundles the worldwide OurAirports database (public domain) into the APK.
      - name: Build airport database
        run: python3 tools/build_airports.py

      # Unit tests (core + wear), Android lint and debug/release assembly.
      - name: Build, test and lint
        env:
          # Optional: enables Enginetime Google Drive sync in the APK (see docs/ENGINETIME.md).
          ENGINETIME_CLIENT_ID: ${{ secrets.ENGINETIME_CLIENT_ID }}
          ENGINETIME_CLIENT_SECRET: ${{ secrets.ENGINETIME_CLIENT_SECRET }}
        run: ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: aviation-watch-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
